name: Build macOS dmg

# 触发方式：
# 1) 手动触发—— 只上传 Actions Artifacts，方便验证打包。
# 2) 正式 dmg 使用本机证书签名/公证，不随 GitHub tag 自动发布。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（仓库根目录，npm workspaces）
        run: npm ci

      - name: 前端类型检查（vue-tsc）
        run: npx vue-tsc --noEmit -p tsconfig.web.json
        working-directory: apps/desktop

      - name: 打包 macOS dmg
        run: npm run build:mac
        working-directory: apps/desktop

      - name: 上传构建产物（每次运行都会有，方便调试）
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac.zip
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
