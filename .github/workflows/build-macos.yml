name: Build macOS dmg

# 触发方式：
# 1) push 一个 v 开头的 tag（比如 v0.1.3）—— 自动创建/更新 GitHub Release，上传 dmg/zip。
# 2) 手动触发—— 只上传 Actions Artifacts，方便验证打包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（仓库根目录，npm workspaces）
        run: npm ci

      - name: 前端类型检查（vue-tsc）
        run: npx vue-tsc --noEmit -p tsconfig.web.json
        working-directory: apps/desktop

      - name: 打包 macOS dmg
        run: npm run build:mac
        working-directory: apps/desktop

      - name: 上传构建产物（每次运行都会有，方便调试）
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release（只在 push tag 时触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac.zip
          generate_release_notes: true
