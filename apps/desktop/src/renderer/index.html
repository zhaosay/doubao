<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- M0 阶段 CSP 放宽以保证 Vite dev/HMR 可用，打包发布前需要收紧。
         img-src 曾经没有单独声明，会退回 default-src（没有 data:），导致所有本地
         参考图预览缩略图(pathPreviewCache 里存的 data:image/... base64)在渲染进程
         被 CSP 静默拦截——不报 JS 异常、不触发任何 onerror 回调，表现就是"选完图/
         重新打开项目，缩略图完全不出来，也没有任何报错"，在 Windows 和 macOS 上
         都是同一个原因，跟文件权限无关。补上 data: 和 ai-service 的 127.0.0.1 任意本地端口
         (给 /health、/files/... 和动态避让端口用)这个来源。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' ws://127.0.0.1:* http://127.0.0.1:*; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: http://127.0.0.1:*; media-src 'self' data: http://127.0.0.1:*; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*" />
    <title>AI视频工作台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
